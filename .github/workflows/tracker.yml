name: Tracker

# Checks the content of the videos and the tracker on every pull request: the storyboards and video.json files match
# the format and the writing rules, and every catalog feature is covered. A video's pull request changes only its own
# folder and its entry in tracker/videos.json, so TRACKER.md and tracker/COVERAGE.md (generated, shared by every
# video) are not checked there: they are refreshed in a pull request of their own, and a manual run checks them.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the content of the videos
        run: python tools/validate_content.py

      - name: Validate the tracker
        run: python tools/tracker.py validate

      - name: Check that TRACKER.md and tracker/COVERAGE.md are up to date
        if: github.event_name == 'workflow_dispatch'
        run: python tools/tracker.py report --check
