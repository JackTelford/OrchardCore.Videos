name: Publish video

# Publishing a release tagged <slug>/v<N> (created as a draft by `youtube.py release`) sends its MP4 to YouTube with
# everything in videos/<slug>/video.json to the Orchard Core channel, records the YouTube id in this repository, and
# opens a pull request in OrchardCMS/OrchardCore that fills in the <!-- video:<slug> --> markers of the documentation.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish, such as ai-profile-builder/v1'
        required: true

permissions:
  contents: write

concurrency:
  group: publish-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      DOCS_REPOSITORY: OrchardCMS/OrchardCore
      DOCS_FOLDER: src/docs
      DOCS_BASE_BRANCH: main
      # Optional: a fork of DOCS_REPOSITORY owned by the account of DOCS_REPOSITORY_TOKEN, such as
      # MikeAlhayek/OrchardCore. Set it as a repository variable when that account can't push branches to DOCS_REPOSITORY.
      DOCS_FORK_REPOSITORY: ${{ vars.DOCS_FORK_REPOSITORY }}
    steps:
      - name: Read the release tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^([a-z0-9-]+)/(v[0-9]+)$ ]]; then
            echo "::error::'$TAG' is not a video release tag: expected <slug>/v<N>, such as ai-profile-builder/v1."
            exit 1
          fi
          echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Check the YouTube credentials
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] || [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "::error::Set the YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET and YOUTUBE_REFRESH_TOKEN secrets (see tools/youtube/README.md), then run this workflow again for $TAG."
            exit 1
          fi

      # The latest main, not the tag: the video's metadata may have been corrected since the tag was made, and the
      # YouTube id is committed back to main.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the tools
        run: pip install -r tools/youtube/requirements.txt

      - name: Download the video
        id: file
        run: |
          gh release download "$TAG" --pattern '*.mp4' --dir release --repo "$GITHUB_REPOSITORY"
          file=$(ls release/*.mp4 | head -n 1)
          [ -n "$file" ] || { echo "::error::The release $TAG has no MP4 attached."; exit 1; }
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        id: youtube
        run: |
          slug='${{ steps.tag.outputs.slug }}'
          version='${{ steps.tag.outputs.version }}'
          existing=$(python -c "import json; print(json.load(open('videos/$slug/video.json')).get('youtube', {}).get('version', ''))")
          if [ "$existing" = "$version" ]; then
            echo "::error::$slug $version is already on YouTube. Publish a new version (youtube.py release) or edit video.json for metadata."
            exit 1
          fi
          python tools/youtube/youtube.py publish "$slug" --file '${{ steps.file.outputs.path }}' --version "$version"

      - name: Record the YouTube id
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'videos/${{ steps.tag.outputs.slug }}/video.json' README.md
          git commit -m "Publish ${{ steps.tag.outputs.slug }} ${{ steps.tag.outputs.version }}: ${{ steps.youtube.outputs.url }}"
          git push origin HEAD:main

      - name: Add the YouTube link to the release
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)

          **YouTube:** ${{ steps.youtube.outputs.url }}"

      # The documentation pull request needs DOCS_REPOSITORY_TOKEN, a token that can open pull requests in
      # OrchardCMS/OrchardCore and push a branch to it (or to the fork named by DOCS_FORK_REPOSITORY). See
      # tools/youtube/README.md.
      - name: Check the documentation token
        id: docs
        env:
          DOCS_REPOSITORY_TOKEN: ${{ secrets.DOCS_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$DOCS_REPOSITORY_TOKEN" ]; then
            echo "::warning::DOCS_REPOSITORY_TOKEN is not set, so no documentation pull request is opened. Run 'python tools/youtube/youtube.py docs-embed ${{ steps.tag.outputs.slug }} --docs <your OrchardCore checkout>/$DOCS_FOLDER' and open the pull request in $DOCS_REPOSITORY by hand."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.docs.outputs.ready == 'true'
        with:
          repository: ${{ env.DOCS_REPOSITORY }}
          token: ${{ secrets.DOCS_REPOSITORY_TOKEN }}
          path: docs-repository
          fetch-depth: 1

      - name: Open the documentation pull request
        if: steps.docs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPOSITORY_TOKEN }}
        run: |
          slug='${{ steps.tag.outputs.slug }}'
          version='${{ steps.tag.outputs.version }}'
          url='${{ steps.youtube.outputs.url }}'
          branch="videos/$slug-$version"

          python tools/youtube/youtube.py docs-embed "$slug" --docs "docs-repository/$DOCS_FOLDER"

          cd docs-repository
          if git diff --quiet; then
            echo "The documentation has no <!-- video:$slug --> marker to fill in, or already points at $url."
            exit 0
          fi

          pages=$(git diff --name-only | sed 's/^/- `/; s/$/`/')
          title=$(python -c "import json; print(json.load(open('../videos/$slug/video.json'))['title'].split(' | ')[0].split(':')[0])")

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add "$DOCS_FOLDER"
          git commit -m "Embed the $title video ($version) in the documentation"

          # Push to the fork when there is one, and open the pull request from it.
          if [ -n "$DOCS_FORK_REPOSITORY" ]; then
            git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/${DOCS_FORK_REPOSITORY}.git"
            git push --force fork "$branch"
            head="${DOCS_FORK_REPOSITORY%%/*}:$branch"
          else
            git push --force origin "$branch"
            head="$branch"
          fi

          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Embeds the $title video ($version) at $url, published from [$GITHUB_REPOSITORY $TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG), where a page has a \`<!-- video:$slug -->\` marker." \
            "**Pages changed:**" \
            "$pages" \
            "This pull request was opened by the publish-video workflow of $GITHUB_REPOSITORY. It only fills in the iframe after each marker.")

          existing=$(gh pr list --repo "$DOCS_REPOSITORY" --head "$branch" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$DOCS_REPOSITORY" --body "$body"
          else
            gh pr create --repo "$DOCS_REPOSITORY" --base "$DOCS_BASE_BRANCH" --head "$branch" --title "Embed the $title video ($version)" --body "$body"
          fi
